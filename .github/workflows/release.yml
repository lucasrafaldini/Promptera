name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Extract version
        id: version
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Update version in project
        run: |
          # Update any version references if needed
          echo "Building version ${{ steps.version.outputs.VERSION }}"

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build release
        run: swift build -c release

      - name: Run tests
        # Sequential (the default): tests share UserDefaults, same as CI
        run: swift test

      - name: Build app bundle
        run: |
          chmod +x scripts/build_app.sh
          ./scripts/build_app.sh

      - name: Create DMG
        run: |
          hdiutil create -volname "Promptera ${{ steps.version.outputs.VERSION }}" \
            -srcfolder build/Promptera.app \
            -ov -format UDZO \
            build/Promptera-${{ steps.version.outputs.VERSION }}.dmg

      - name: Create ZIP
        run: |
          cd build
          ditto -c -k --keepParent Promptera.app Promptera-${{ steps.version.outputs.VERSION }}.zip

      - name: Generate checksums
        run: |
          cd build
          shasum -a 256 Promptera-${{ steps.version.outputs.VERSION }}.dmg Promptera-${{ steps.version.outputs.VERSION }}.zip > Promptera-${{ steps.version.outputs.VERSION }}.sha256
          cat Promptera-${{ steps.version.outputs.VERSION }}.sha256

      - name: Check for existing release
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A release published manually (with screenshots and notes) is left untouched;
          # the workflow then only validates that the tag builds and passes tests.
          if gh release view "${{ steps.version.outputs.VERSION }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        if: steps.existing.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: Promptera ${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            build/Promptera-${{ steps.version.outputs.VERSION }}.dmg
            build/Promptera-${{ steps.version.outputs.VERSION }}.zip
            build/Promptera-${{ steps.version.outputs.VERSION }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}