name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Extract version
        id: version
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Update version in project
        run: |
          # Update any version references if needed
          echo "Building version ${{ steps.version.outputs.VERSION }}"

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build release
        run: swift build -c release

      - name: Run tests
        # Sequential (the default): tests share UserDefaults, same as CI
        run: swift test

      - name: Build app bundle
        env:
          PROMPTERA_VERSION: ${{ steps.version.outputs.VERSION }}
          PROMPTERA_BUILD: ${{ github.run_number }}
        run: |
          chmod +x scripts/build_app.sh
          ./scripts/build_app.sh

      - name: Sign app (Developer ID)
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ]; then
            echo "::warning::MACOS_CERTIFICATE is not configured; keeping the ad-hoc signature."
            exit 0
          fi
          chmod +x scripts/sign_app.sh
          ./scripts/sign_app.sh build/Promptera.app

      - name: Create ZIP
        run: |
          cd build
          ditto -c -k --keepParent Promptera.app Promptera-${{ steps.version.outputs.VERSION }}.zip

      - name: Notarize ZIP
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "::warning::Notarization secrets are not configured; skipping notarization."
            exit 0
          fi
          chmod +x scripts/notarize.sh
          ./scripts/notarize.sh "build/Promptera-${{ steps.version.outputs.VERSION }}.zip"

      - name: Create DMG
        run: |
          hdiutil create -volname "Promptera ${{ steps.version.outputs.VERSION }}" \
            -srcfolder build/Promptera.app \
            -ov -format UDZO \
            build/Promptera-${{ steps.version.outputs.VERSION }}.dmg

      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "::warning::Notarization secrets are not configured; skipping notarization."
            exit 0
          fi
          ./scripts/notarize.sh "build/Promptera-${{ steps.version.outputs.VERSION }}.dmg"

      - name: Generate checksums
        run: |
          cd build
          shasum -a 256 Promptera-${{ steps.version.outputs.VERSION }}.dmg Promptera-${{ steps.version.outputs.VERSION }}.zip > Promptera-${{ steps.version.outputs.VERSION }}.sha256
          cat Promptera-${{ steps.version.outputs.VERSION }}.sha256

      - name: Generate Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::warning::SPARKLE_PRIVATE_KEY is not configured; skipping appcast generation."
            exit 0
          fi
          curl -sL --fail -o Sparkle.tar.xz \
            https://github.com/sparkle-project/Sparkle/releases/download/2.10.1/Sparkle-2.10.1.tar.xz
          tar -xf Sparkle.tar.xz
          mkdir -p build/appcast
          cp "build/Promptera-$VERSION.zip" build/appcast/
          echo "$SPARKLE_PRIVATE_KEY" | ./bin/generate_appcast \
            --ed-key-file - \
            --download-url-prefix "https://github.com/lucasrafaldini/Promptera/releases/download/$VERSION/" \
            build/appcast
          cp build/appcast/appcast.xml build/appcast.xml

      - name: Check for existing release
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A release published manually (with screenshots and notes) is left untouched;
          # the workflow then only validates that the tag builds and passes tests.
          if gh release view "${{ steps.version.outputs.VERSION }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        if: steps.existing.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: Promptera ${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            build/Promptera-${{ steps.version.outputs.VERSION }}.dmg
            build/Promptera-${{ steps.version.outputs.VERSION }}.zip
            build/Promptera-${{ steps.version.outputs.VERSION }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload appcast
        if: steps.existing.outputs.exists != 'true' && hashFiles('build/appcast.xml') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.version.outputs.VERSION }}" build/appcast.xml --clobber